# Put these two blocks inside the existing `server { ... }` block for pepf.net on the VPS,
# then run:  sudo nginx -t && sudo systemctl reload nginx
# The game is then at https://pepf.net/ashen/

location = /ashen {
    return 301 /ashen/;
}

location /ashen/ {
    # Trailing slash strips the /ashen prefix before forwarding to the Pi over WireGuard.
    proxy_pass http://10.10.0.2:6769/;
    proxy_http_version 1.1;

    # WebSocket upgrade for /ashen/ws
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep idle game sockets open (the server also pings every 20s).
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
